<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplicación Todo List interactiva desarrollada con HTML5, CSS3, JavaScript ES6+ y Bootstrap 5 para el Desafío 5 de Desafío Latam.">
  <title>Todo List | Desafío Latam</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

  <div class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-9">
        
        <!-- Main Card Container -->
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
          
          <!-- Card Header -->
          <div class="card-header bg-dark text-white p-4 border-0">
            <div class="d-flex align-items-center justify-content-between">
              <h1 class="h2 mb-0 fw-bold d-flex align-items-center gap-2">
                <i class="fa-solid fa-list-check text-success"></i> Todo List
              </h1>
              <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-2 fs-6">
                Desafío 5
              </span>
            </div>
          </div>

          <!-- Card Body -->
          <div class="card-body p-4 p-md-5">
            
            <!-- Input Form Section -->
            <div class="mb-4">
              <label for="nuevaTareaInput" class="form-label fw-semibold text-secondary">Nueva tarea</label>
              <div class="input-group input-group-lg">
                <input 
                  type="text" 
                  id="nuevaTareaInput" 
                  class="form-control border-end-0 fs-6" 
                  placeholder="Ej. Estudiar métodos de arreglos en JavaScript..."
                  aria-label="Nueva tarea"
                >
                <button 
                  id="btnAgregarTarea" 
                  class="btn btn-success px-4 fw-semibold fs-6 d-flex align-items-center gap-2" 
                  type="button"
                >
                  <i class="fa-solid fa-plus"></i> Agregar
                </button>
              </div>
              <div id="errorFeedback" class="text-danger small mt-2 d-none">
                <i class="fa-solid fa-circle-exclamation me-1"></i> Por favor ingresa una descripción para la tarea.
              </div>
            </div>

            <hr class="my-4 text-muted opacity-25">

            <!-- Content Grid: Summary & Task List -->
            <div class="row g-4">
              
              <!-- Resumen (Left Column) -->
              <div class="col-12 col-md-4">
                <div class="card bg-body-tertiary border-0 rounded-3 p-4 h-100">
                  <h2 class="h5 fw-bold text-dark mb-4 border-bottom pb-2">
                    <i class="fa-solid fa-chart-pie me-2 text-primary"></i>Resumen
                  </h2>
                  
                  <div class="d-flex flex-column gap-3">
                    <div class="p-3 bg-white rounded-3 shadow-sm border border-light">
                      <div class="text-muted small text-uppercase fw-semibold mb-1">Total de Tareas</div>
                      <div class="h3 mb-0 fw-bold text-dark" id="totalTareas">0</div>
                    </div>
                    
                    <div class="p-3 bg-white rounded-3 shadow-sm border border-light">
                      <div class="text-muted small text-uppercase fw-semibold mb-1">Realizadas</div>
                      <div class="h3 mb-0 fw-bold text-success" id="realizadasTareas">0</div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Lista de Tareas (Right Column) -->
              <div class="col-12 col-md-8">
                <div class="table-responsive rounded-3 border border-light shadow-sm">
                  <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th scope="col" class="py-3 ps-3 text-secondary text-uppercase fs-7 fw-bold" style="width: 15%;">ID</th>
                        <th scope="col" class="py-3 text-secondary text-uppercase fs-7 fw-bold" style="width: 55%;">Tarea</th>
                        <th scope="col" class="py-3 text-center text-secondary text-uppercase fs-7 fw-bold" style="width: 15%;">Listo</th>
                        <th scope="col" class="py-3 text-center text-secondary text-uppercase fs-7 fw-bold" style="width: 15%;">Acción</th>
                      </tr>
                    </thead>
                    <tbody id="listaTareas">
                      <!-- Tareas renderizadas dinámicamente desde script.js -->
                    </tbody>
                  </table>
                </div>
              </div>

            </div> <!-- /row -->

          </div> <!-- /card-body -->

          <!-- Card Footer -->
          <div class="card-footer bg-light p-3 text-center text-muted small border-top-0">
            <span>Desarrollado para <strong>Desafío Latam</strong> &bull; Módulo 3: Métodos de los Arreglos</span>
          </div>

        </div> <!-- /card -->
        
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
  <!-- Custom Script -->
  <script src="assets/js/script.js"></script>
</body>
</html>
